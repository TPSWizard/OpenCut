[package]
name = "retakes"
description = "Retakes: finds the earlier takes of a line (and restarts inside one) in a transcript, so only the last take is kept; shared by the desktop and the web (through WASM)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
