[package]
name = "richtext"
description = "Rich text: styled ranges (colour, bold, italic, size) inside one text clip, kept in step with edits; shared by the desktop and the web (through WASM)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
