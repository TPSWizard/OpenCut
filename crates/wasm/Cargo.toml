[package]
name = "opencut-wasm"
version = "0.2.10"
description = "Shared video editor logic compiled to WebAssembly"
repository = "https://github.com/opencut/opencut"
edition.workspace = true
license.workspace = true

[lib]
path = "src/wasm.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
bridge = { workspace = true }
compositor = { workspace = true }
console_error_panic_hook = { workspace = true }
effects = { workspace = true }
gpu = { workspace = true, features = ["wasm"] }
js-sys = { workspace = true }
masks = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
time = { workspace = true, features = ["wasm"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["OffscreenCanvas", "HtmlCanvasElement", "CanvasRenderingContext2d", "Document", "Window", "Performance"] }

[features]
default = ["wasm"]
wasm = []
