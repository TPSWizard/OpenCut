[package]
name = "editor"
description = "Project document, timeline commands, undo history and frame planning shared by every OpenCut front end"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = { workspace = true }
