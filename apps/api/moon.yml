$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'

tasks:
  dev:
    command: 'bun run dev'
    options:
      runInCI: false  # dev server: skipped in CI, never cached

  build:
    command: 'bun run build'
    inputs:
      - 'src/**/*'
      - 'wrangler.jsonc'
      - 'package.json'
    outputs:
      - 'dist'

  test:
    # The worker's helpers and the self-hosted container's gateway.
    command: 'bun test ./src ../../infra/self-host/gateway'
    inputs:
      - 'src/**/*'
      - '/infra/self-host/gateway/**/*'

  typecheck:
    command: 'bun run typecheck'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'

  deploy:
    command: 'bun run deploy'
    deps:
      - '~:build'
