name: Self-host image

# Builds the self-hosted container (infra/self-host) and checks that it
# serves the editor, the API under /api and a share round trip. Runs when
# the container's own files change, or by hand.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/self-host/**"
      - ".dockerignore"
      - ".github/workflows/self-host.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/self-host/**"
      - ".dockerignore"
      - ".github/workflows/self-host.yml"

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -f infra/self-host/Dockerfile -t conzacut:ci .

      - name: Start
        run: |
          docker run -d --name conzacut -p 127.0.0.1:8080:8080 -e SHARE_UPLOAD_KEY=ci-passcode conzacut:ci
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/api/health && exit 0
            sleep 2
          done
          docker logs conzacut
          exit 1

      - name: Smoke test
        run: bash infra/self-host/smoke-test.sh http://127.0.0.1:8080 ci-passcode

      - name: Logs
        if: always()
        run: docker logs conzacut || true
