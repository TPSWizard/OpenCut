name: Android app

# Builds ConzaCut for Android (apps/android: a Trusted Web Activity around
# https://conzacut.conzahub.com) as an APK to install and an AAB for Google
# Play, signed with the key in the ANDROID_KEYSTORE_* secrets. Checks that
# the APK's signing certificate is the one the site's assetlinks.json
# trusts, so the app opens without an address bar. Without the secrets
# (forks) it signs with a debug key instead.

on:
  workflow_dispatch:
  push:
    branches: [main, finish-web-editor]
    paths:
      - "apps/android/**"
      - "apps/web/public/.well-known/assetlinks.json"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key: the APK is signed with a debug key and shows an address bar."
          fi

      - name: Build
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          gradle --no-daemon assembleRelease bundleRelease
          -PversionCode=${{ github.run_number }}
          -PversionName=1.0.${{ github.run_number }}

      - name: Check the signature matches assetlinks.json
        if: env.ANDROID_KEYSTORE_PATH != ''
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          signed=$(grep -m1 'SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          trusted=$(python3 -c "import json; print(json.load(open('apps/web/public/.well-known/assetlinks.json'))[0]['target']['sha256_cert_fingerprints'][0])")
          if [ "$signed" != "$trusted" ]; then
            echo "::error::The APK is signed with $signed but assetlinks.json trusts $trusted"
            exit 1
          fi
          echo "Signed with the key assetlinks.json trusts: $signed"

      - uses: actions/upload-artifact@v4
        with:
          name: conzacut-android-${{ github.run_number }}
          path: |
            apps/android/app/build/outputs/apk/release/app-release.apk
            apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
