[workspace]
resolver = "3"
# Members are listed explicitly rather than via 'crates/*' because
# crates/media holds only a setup script and has no Cargo.toml.
members = [
  'apps/desktop',
  'apps/render-cli',
  'crates/bridge',
  'crates/compositor',
  'crates/editor',
  'crates/effects',
  'crates/gpu',
  'crates/masks',
  'crates/media',
  'crates/render',
  'crates/time',
  'crates/wasm',
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal crates
bridge = { path = "crates/bridge" }
compositor = { path = "crates/compositor" }
editor = { path = "crates/editor" }
effects = { path = "crates/effects" }
gpu = { path = "crates/gpu" }
masks = { path = "crates/masks" }
media = { path = "crates/media" }
render = { path = "crates/render" }
time = { path = "crates/time" }

# Desktop
gpui = "0.2.2"

# Core
bytemuck = { version = "1.25.0", features = ["derive"] }
num-traits = "0.2.19"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
wgpu = "29.0.1"
gl-transitions = { version = "1.0.4", default-features = false, features = ["wgsl"] }
serde_json = "1.0.149"
uuid = { version = "1.24.0", features = ["v4"] }
tempfile = "3.27.0"
pollster = "0.4.0"
cosmic-text = "0.14.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
smallvec = "1.15.1"
futures = "0.3.33"
cpal = "0.16.0"
unicode-segmentation = "1.12.0"

# Proc-macro
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full"] }

# Web / wasm
console_error_panic_hook = "0.1.7"
js-sys = "0.3.93"
serde-wasm-bindgen = "0.6.5"
tsify-next = "0.5"
wasm-bindgen = "0.2.116"
wasm-bindgen-futures = "0.4.66"
web-sys = "0.3.93"
